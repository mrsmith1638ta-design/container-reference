<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a5568"/>
    </marker>
    <marker id="arrowDash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b7791f"/>
    </marker>
  </defs>

  <rect width="1280" height="800" fill="#ffffff"/>

  <text x="56" y="56" font-size="27" font-weight="600" fill="#1a202c">Tri-Cloud Container Deployment with Evidence-Backed Delivery</text>
  <text x="56" y="82" font-size="15" fill="#718096">Reference pattern — primary / secondary failover, independent continuity estate, fail-closed posture</text>

  <line x1="56" y1="100" x2="1224" y2="100" stroke="#e2e8f0" stroke-width="1"/>

  <text x="56" y="140" font-size="12" font-weight="700" fill="#718096" letter-spacing="1.4">BUILD AND VERIFICATION</text>

  <rect x="56" y="156" width="228" height="86" rx="8" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1.5"/>
  <text x="76" y="186" font-size="15" font-weight="600" fill="#1a202c">Source repository</text>
  <text x="76" y="208" font-size="13" fill="#4a5568">Pinned dependencies</text>
  <text x="76" y="227" font-size="13" fill="#4a5568">Non-root Dockerfile</text>

  <rect x="340" y="156" width="228" height="86" rx="8" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1.5"/>
  <text x="360" y="186" font-size="15" font-weight="600" fill="#1a202c">CI pipeline</text>
  <text x="360" y="208" font-size="13" fill="#4a5568">Build · test suite</text>
  <text x="360" y="227" font-size="13" fill="#4a5568">Multi-pass security audit</text>

  <rect x="624" y="156" width="228" height="86" rx="8" fill="#fffaf0" stroke="#dd9b3f" stroke-width="2"/>
  <text x="644" y="186" font-size="15" font-weight="600" fill="#744210">Evidence package</text>
  <text x="644" y="208" font-size="13" fill="#744210">SHA-256 source hashes</text>
  <text x="644" y="227" font-size="13" fill="#744210">Live HTTP session capture</text>

  <rect x="908" y="156" width="228" height="86" rx="8" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1.5"/>
  <text x="928" y="186" font-size="15" font-weight="600" fill="#1a202c">Container registry</text>
  <text x="928" y="208" font-size="13" fill="#4a5568">Immutable tagged image</text>
  <text x="928" y="227" font-size="13" fill="#4a5568">Promotion gated on PASS</text>

  <line x1="284" y1="199" x2="332" y2="199" stroke="#4a5568" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="568" y1="199" x2="616" y2="199" stroke="#4a5568" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="852" y1="199" x2="900" y2="199" stroke="#4a5568" stroke-width="1.8" marker-end="url(#arrow)"/>

  <text x="56" y="300" font-size="12" font-weight="700" fill="#718096" letter-spacing="1.4">RUNTIME ESTATE</text>

  <rect x="56" y="318" width="356" height="208" rx="8" fill="#ebf4ff" stroke="#3f6fb5" stroke-width="2"/>
  <text x="80" y="350" font-size="16" font-weight="700" fill="#1a365d">PRIMARY</text>
  <text x="80" y="376" font-size="14" font-weight="600" fill="#2a4365">Managed serverless containers</text>
  <line x1="80" y1="390" x2="388" y2="390" stroke="#bcd3f0" stroke-width="1"/>
  <text x="80" y="414" font-size="13" fill="#2c5282">Autoscale from zero</text>
  <text x="80" y="437" font-size="13" fill="#2c5282">Liveness and readiness probes</text>
  <text x="80" y="460" font-size="13" fill="#2c5282">Secrets from managed vault</text>
  <text x="80" y="483" font-size="13" fill="#2c5282">Parallel service tested before promotion</text>
  <text x="80" y="506" font-size="13" fill="#2c5282">Zero-interaction deploy</text>

  <rect x="462" y="318" width="356" height="208" rx="8" fill="#f7fafc" stroke="#718096" stroke-width="2"/>
  <text x="486" y="350" font-size="16" font-weight="700" fill="#2d3748">SECONDARY</text>
  <text x="486" y="376" font-size="14" font-weight="600" fill="#4a5568">Failover runtime</text>
  <line x1="486" y1="390" x2="794" y2="390" stroke="#e2e8f0" stroke-width="1"/>
  <text x="486" y="414" font-size="13" fill="#4a5568">Same image, same digest</text>
  <text x="486" y="437" font-size="13" fill="#4a5568">Warm standby, health gated</text>
  <text x="486" y="460" font-size="13" fill="#4a5568">Object storage hardened baseline</text>
  <text x="486" y="483" font-size="13" fill="#4a5568">Failover only to authorized regions</text>
  <text x="486" y="506" font-size="13" fill="#4a5568">Availability path, never a safety bypass</text>

  <rect x="868" y="318" width="356" height="208" rx="8" fill="#f7fafc" stroke="#718096" stroke-width="2"/>
  <text x="892" y="350" font-size="16" font-weight="700" fill="#2d3748">CONTINUITY</text>
  <text x="892" y="376" font-size="14" font-weight="600" fill="#4a5568">Independent estate</text>
  <line x1="892" y1="390" x2="1200" y2="390" stroke="#e2e8f0" stroke-width="1"/>
  <text x="892" y="414" font-size="13" fill="#4a5568">Full repositories, not mirrors</text>
  <text x="892" y="437" font-size="13" fill="#4a5568">Survives loss of source host</text>
  <text x="892" y="460" font-size="13" fill="#4a5568">Backup and failover, both</text>
  <text x="892" y="483" font-size="13" fill="#4a5568">Container runtime held ready</text>
  <text x="892" y="506" font-size="13" fill="#4a5568">Residency constraints enforced</text>

  <path d="M 1022 242 L 1022 280 L 234 280 L 234 310" fill="none" stroke="#4a5568" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M 1022 242 L 1022 280 L 640 280 L 640 310" fill="none" stroke="#4a5568" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M 1022 242 L 1022 310" fill="none" stroke="#4a5568" stroke-width="1.8" marker-end="url(#arrow)"/>

  <path d="M 412 422 L 454 422" fill="none" stroke="#b7791f" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#arrowDash)"/>
  <text x="398" y="402" font-size="11.5" font-weight="600" fill="#b7791f">failover</text>

  <path d="M 818 422 L 860 422" fill="none" stroke="#b7791f" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#arrowDash)"/>
  <text x="804" y="402" font-size="11.5" font-weight="600" fill="#b7791f">continuity</text>

  <text x="56" y="584" font-size="12" font-weight="700" fill="#718096" letter-spacing="1.4">CROSS-CUTTING CONTROLS</text>

  <rect x="56" y="600" width="356" height="112" rx="8" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1.5"/>
  <text x="80" y="630" font-size="15" font-weight="600" fill="#1a202c">Fail-closed posture</text>
  <text x="80" y="654" font-size="13" fill="#4a5568">Missing trust key, unavailable store or</text>
  <text x="80" y="674" font-size="13" fill="#4a5568">unreachable audit sink halts the request.</text>
  <text x="80" y="694" font-size="13" fill="#4a5568">No silent fallback to permissive mode.</text>

  <rect x="462" y="600" width="356" height="112" rx="8" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1.5"/>
  <text x="486" y="630" font-size="15" font-weight="600" fill="#1a202c">Immutable audit</text>
  <text x="486" y="654" font-size="13" fill="#4a5568">Structured records carrying actor, request</text>
  <text x="486" y="674" font-size="13" fill="#4a5568">fingerprint, prior and current digest.</text>
  <text x="486" y="694" font-size="13" fill="#4a5568">Inputs sanitized before write.</text>

  <rect x="868" y="600" width="356" height="112" rx="8" fill="#fffaf0" stroke="#dd9b3f" stroke-width="2"/>
  <text x="892" y="630" font-size="15" font-weight="600" fill="#744210">Delivered evidence</text>
  <text x="892" y="654" font-size="13" fill="#744210">Environment fingerprint, source hashes,</text>
  <text x="892" y="674" font-size="13" fill="#744210">test output and captured live session,</text>
  <text x="892" y="694" font-size="13" fill="#744210">timestamped and shipped with the build.</text>

  <line x1="56" y1="748" x2="1224" y2="748" stroke="#e2e8f0" stroke-width="1"/>
  <text x="56" y="772" font-size="12.5" fill="#a0aec0">Deployment pattern reference. Cloud providers are interchangeable; roles are fixed by policy, residency and contractual constraint.</text>
</svg>
